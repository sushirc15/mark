  <text x="150" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#F5C542" text-anchor="middle" letter-spacing="1.2">PRAGMATIC PLAY</text>
